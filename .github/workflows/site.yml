name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "coletor/**"
      - "config/**"
      - "data/**"
      - "site_src/**"
      - "tests/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/testes.yml"
  workflow_run:
    workflows: ["Coleta semanal"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # como no modelo do GitHub Pages: não interrompe uma publicação em andamento
  cancel-in-progress: false

jobs:
  testes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/testes.yml
    with:
      ref: main

  gerar:
    needs: testes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # o código do repositório roda aqui: sem pages: write nem id-token: write, que ficam
    # só com a publicação; pages: read basta para actions/configure-pages consultar o site
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # exatamente o commit aprovado nos testes, mesmo que main tenha avançado depois
          ref: ${{ needs.testes.outputs.sha }}

      - name: Confirmar que o commit foi testado
        env:
          SHA_TESTADO: ${{ needs.testes.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA_TESTADO"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar site estático
        run: python -m coletor.gerar_site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
